version: "3.9"

services:
  # --- Infrastructure ---
  redis:
    image: redis:7-alpine
    container_name: port_rally_redis_prod
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"] # 데이터 저장 활성화
    ports:
      - "6379:6379"
    restart: always
    env_file:
      - .env.prod

  postgres:
    image: postgres:16-alpine
    container_name: port_rally_postgres_prod
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  # --- Applications ---
  market-data:
    build:
      context: services/market-data
    container_name: port_rally_market_prod
    env_file:
      - .env.prod
      - services/market-data/.env
    restart: always
    depends_on:
      - redis

  core-api:
    build:
      context: apps/core-api
    container_name: port_rally_api_prod
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080" # API만 외부 노출 (또는 리버스 프록시 뒤에 배치 시 제거 가능)
    restart: always
    depends_on:
      - postgres
      - redis
    command: ["java", "-jar", "/app/app.jar"]

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_SERVER_URL: ${NEXT_PUBLIC_API_SERVER_URL}
    container_name: port_rally_web_prod
    env_file:
      - .env.prod
    environment:
      # .env.prod 설정을 덮어씁니다 (Docker 내부 통신용)
      - API_SERVER_URL=http://core-api:8080
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - core-api

volumes:
  postgres_data_prod:
