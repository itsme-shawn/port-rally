server:
  port: 0

spring:
  profiles:
    active: test

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/port_rally_test
    username: test
    password: test

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: test-secret-test-secret-test-secret-test-secret
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  cookie:
    domain: localhost
    secure: false
    same-site: Lax

oauth2:
  success-redirect-uri: http://localhost:3000/auth/callback
  failure-redirect-uri: http://localhost:3000/auth/error

cors:
  allowed-origins: http://localhost:3000
