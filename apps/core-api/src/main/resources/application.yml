server:
  port: ${API_PORT}
  forward-headers-strategy: framework

spring:
  application:
    name: core-api

  # R2DBC Configuration
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # Flyway Configuration (uses JDBC)
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DB}

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

app:
  market-data:
    base-url: ${MARKET_DATA_URL}
  ocr:
    tesseract:
      data-path: ${TESSERACT_DATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
      language: kor+eng

oauth2:
  success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI}
  failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI}

  # kafka:
  #   bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging:
  level:
    root: INFO
    "[org.springframework]": INFO
    "[org.flywaydb]": INFO
    "[api]": INFO
    "[api.controller]": INFO
    "[api.service]": INFO
    "[api.security]": DEBUG
    org.springframework.core.codec: INFO
  # file:
  #   name: logs/core-api.log
  # logback:
  #   rollingpolicy:
  #     max-file-size: 10MB
  #     max-history: 7

# R2DBC SQL 쿼리 로깅 (개발용)
    io.r2dbc.postgresql: INFO
    org.springframework.r2dbc: INFO
    org.springframework.data.r2dbc: INFO


management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger가 상대 경로 사용하도록 설정 (프록시 환경 지원)
springdoc:
  swagger-ui:
    use-root-path: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000       # 15분 (밀리초)
  refresh-token-expiration: 604800000   # 7일 (밀리초)
  cookie:
    domain: ${COOKIE_DOMAIN}           # 비워두면 현재 도메인 사용
    secure: ${COOKIE_SECURE}
    same-site: Lax



