[project]
name = "ai-advisor"
version = "0.1.0"
description = "AI Portfolio and Asset Analysis Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.6",  # Gemini integration
    "pydantic>=2.7",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.30.0",
    "redis>=5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]
