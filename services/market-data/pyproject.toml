[project]
name = "quote-pipeline"
version = "0.1.0"
description = "Market data ingestion (WebSocket to Redis Pub/Sub) for PortRally Phase 0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0,<13.0",
    "pydantic>=2.7,<3.0",
    "redis>=5.0,<6.0",
    "python-kis>=2.1.6",
    "python-dotenv>=1.2.1",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pandas>=2.3.3",
    "requests>=2.32.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/quote_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
  "src/quote_pipeline",
  "pyproject.toml",
]
